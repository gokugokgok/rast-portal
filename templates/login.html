<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Portal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="brand-small" href="/">Portal<span class="brand-dot"></span></a>
    <section class="login-card" aria-labelledby="login-heading">
      <div class="login-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14v3"/></svg></div>
      <h1 id="login-heading">パスワードを入力</h1>
      <p>初めてのブラウザでは、パスワードが必要です。</p>
      <form method="post" action="/login">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" required maxlength="256" autocomplete="current-password" autofocus spellcheck="false" autocapitalize="off" enterkeyhint="go"{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
        {% if error %}<p id="login-error" class="login-error" role="alert">{{ error }}</p>{% endif %}
        <button class="login-submit" type="submit">サイトに入る <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-note">入った後は、このブラウザの認証を1年間覚えます。<br>Cookieの削除や別のブラウザでは、再入力が必要です。</p>
    </section>
    <p class="login-footer">検索履歴はCookieに保存しません。</p>
  </main>
</body>
</html>
